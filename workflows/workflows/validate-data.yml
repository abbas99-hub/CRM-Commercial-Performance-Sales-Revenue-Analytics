name: Validate CRM Dataset

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate CSV files exist
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'Accounts.csv','Contacts.csv','SalesReps.csv','Products.csv',
              'Campaigns.csv','Leads.csv','Opportunities.csv',
              'OpportunityProducts.csv','Activities.csv','Targets.csv','Date.csv'
          ]
          root=Path('data/raw')
          missing=[x for x in required if not (root/x).exists()]
          if missing:
              raise SystemExit(f'Missing files: {missing}')
          print('CRM dataset files validated.')
          PY
